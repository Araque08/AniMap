# Plantilla: completar y revisar antes de usar. No crea recursos por sí sola.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: animap-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/cloudsql-instances: animapbd:southamerica-east1:animap-postgresql
        # Requiere la VPC/subred aprobada y NAT con IP fija autorizada en Atlas.
        run.googleapis.com/network-interfaces: '[{"network":"VPC_APROBADA","subnetwork":"SUBRED_APROBADA"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      serviceAccountName: RUNTIME_SA@animapbd.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 180
      containers:
        - image: southamerica-east1-docker.pkg.dev/animapbd/REPOSITORIO/animap-api:VERSION
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          env:
            - name: NODE_ENV
              value: production
            - name: GOOGLE_CLOUD_PROJECT
              value: animapbd
            - name: DB_HOST
              value: /cloudsql/animapbd:southamerica-east1:animap-postgresql
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              value: animap
            - name: DB_USER
              value: USUARIO_DB_APROBADO
            - name: DB_SSL
              value: 'false'
            - name: DB_POOL_MAX
              value: '5'
            - name: TRUST_PROXY_HOPS
              value: '1'
            - name: MONGO_DB_NAME
              value: animap
            - name: GEOFENCE_MODE
              value: ENFORCE
            - name: FCM_PROCESSING_MODE
              value: scheduled
            - name: FCM_PUSH_ENABLED
              value: 'false'
            - name: FCM_TEST_MODE
              value: 'false'
            - name: NOTIFICATION_WORKER_AUDIENCE
              value: https://URL_ESTABLE_DEL_SERVICIO.run.app
            - name: NOTIFICATION_WORKER_SERVICE_ACCOUNT_EMAIL
              value: SCHEDULER_SA@animapbd.iam.gserviceaccount.com
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: animap-db-password, key: VERSION_APROBADA }
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef: { name: animap-jwt-access, key: VERSION_APROBADA }
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef: { name: animap-jwt-refresh, key: VERSION_APROBADA }
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: animap-mongo-uri, key: VERSION_APROBADA }
            - name: MAIL_HOST
              value: smtp.gmail.com
            - name: MAIL_PORT
              value: '587'
            - name: MAIL_SECURE
              value: 'false'
            - name: MAIL_USER
              value: CORREO_AUTORIZADO
            - name: MAIL_FROM
              value: CORREO_AUTORIZADO
            - name: MAIL_PASS
              valueFrom:
                secretKeyRef: { name: animap-mail-password, key: VERSION_APROBADA }
            - name: GOOGLE_GEOCODING_API_KEY
              valueFrom:
                secretKeyRef: { name: animap-geocoding-key, key: VERSION_APROBADA }
